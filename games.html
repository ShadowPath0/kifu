<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parties — Kifu</title>
  <link rel="stylesheet" href="css/style.css?v=208" />
</head>
<body>
  <div id="nav-root"></div>
  <main>
    <h1 data-i18n="games.title">Parties</h1>

    <div class="toolbar panel">
      <div class="field">
        <label for="fl-search" data-i18n="games.search">Recherche</label>
        <input id="fl-search" type="text" placeholder="titre, adversaire..." data-i18n-placeholder="games.searchPlaceholder" />
      </div>
      <div class="field">
        <label for="fl-color" data-i18n="games.colorPlayed">Couleur jouée</label>
        <select id="fl-color">
          <option value="" data-i18n="dashboard.filters.colorAll">Toutes</option>
          <option value="black" data-i18n="dashboard.filters.colorBlack">Noir</option>
          <option value="white" data-i18n="dashboard.filters.colorWhite">Blanc</option>
        </select>
      </div>
      <div class="field">
        <label for="fl-platform" data-i18n="games.platform">Plateforme</label>
        <input id="fl-platform" type="text" placeholder="ex : KGS" data-i18n-placeholder="dashboard.filters.platformPlaceholder" />
      </div>
      <div class="field">
        <label for="fl-date-from" data-i18n="games.from">Du</label>
        <input id="fl-date-from" type="date" />
      </div>
      <div class="field">
        <label for="fl-date-to" data-i18n="games.to">Au</label>
        <input id="fl-date-to" type="date" />
      </div>
      <div class="field">
        <button id="fl-apply" class="primary" data-i18n="games.apply">Filtrer</button>
      </div>
      <div class="field">
        <button id="fl-reset" data-i18n="games.reset">Réinitialiser</button>
      </div>
      <div class="field" style="margin-left:auto;">
        <a class="btn primary" style="text-decoration:none;display:inline-block;" href="import.html" data-i18n="games.import">+ Importer une partie</a>
      </div>
    </div>

    <div class="panel">
      <table id="games-table">
        <thead>
          <tr>
            <th data-sort="date_played" data-i18n="games.col.date">Date</th>
            <th data-sort="opponent_name" data-i18n="games.col.opponent">Adversaire</th>
            <th data-sort="opponent_rank" data-i18n="games.col.opponentRank">Rang adv.</th>
            <th data-sort="user_color" data-i18n="games.col.color">Couleur</th>
            <th data-sort="result" data-i18n="games.col.result">Résultat</th>
            <th data-sort="platform" data-i18n="games.col.platform">Plateforme</th>
            <th data-sort="error_count" data-i18n="games.col.errors">Erreurs taguées</th>
          </tr>
        </thead>
        <tbody id="games-tbody"></tbody>
      </table>
      <p id="empty-msg" class="muted hidden" data-i18n="games.empty">Aucune partie ne correspond à ces filtres.</p>
    </div>
  </main>

  <script src="js/sgf.js?v=208"></script>
  <script src="js/api.js?v=208"></script>
  <script src="js/i18n.js?v=208"></script>
  <script src="js/nav.js?v=208"></script>
  <script src="js/games.js?v=208"></script>
</body>
</html>
