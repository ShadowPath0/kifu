<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Kifu</title>
  <link rel="stylesheet" href="css/style.css?v=101" />
</head>
<body>
  <div id="nav-root"></div>
  <main>
    <h1 data-i18n="dashboard.title">Dashboard</h1>

    <div class="stat-cards" id="stat-cards"></div>

    <div class="panel">
      <div class="toolbar" style="margin-bottom:0;">
        <div class="field">
          <label for="fl-date-from" data-i18n="dashboard.filters.from">Du</label>
          <input id="fl-date-from" type="date" />
        </div>
        <div class="field">
          <label for="fl-date-to" data-i18n="dashboard.filters.to">Au</label>
          <input id="fl-date-to" type="date" />
        </div>
        <div class="field">
          <label for="fl-color" data-i18n="dashboard.filters.color">Couleur</label>
          <select id="fl-color">
            <option value="" data-i18n="dashboard.filters.colorAll">Toutes</option>
            <option value="black" data-i18n="dashboard.filters.colorBlack">Noir</option>
            <option value="white" data-i18n="dashboard.filters.colorWhite">Blanc</option>
          </select>
        </div>
        <div class="field">
          <label for="fl-phase" data-i18n="dashboard.filters.phase">Phase</label>
          <select id="fl-phase">
            <option value="" data-i18n="dashboard.filters.phaseAll">Toutes</option>
            <option value="fuseki" data-i18n="dashboard.filters.phaseFuseki">Fuseki</option>
            <option value="milieu" data-i18n="dashboard.filters.phaseMilieu">Milieu</option>
            <option value="yose" data-i18n="dashboard.filters.phaseYose">Yose</option>
          </select>
        </div>
        <div class="field">
          <label for="fl-severity" data-i18n="dashboard.filters.severity">Sévérité</label>
          <select id="fl-severity">
            <option value="" data-i18n="dashboard.filters.severityAll">Toutes</option>
            <option value="mineure" data-i18n="dashboard.filters.severityMineure">Mineure</option>
            <option value="moyenne" data-i18n="dashboard.filters.severityMoyenne">Moyenne</option>
            <option value="critique" data-i18n="dashboard.filters.severityCritique">Critique</option>
          </select>
        </div>
        <div class="field">
          <label for="fl-platform" data-i18n="dashboard.filters.platform">Plateforme</label>
          <input id="fl-platform" type="text" placeholder="ex : KGS" data-i18n-placeholder="dashboard.filters.platformPlaceholder" />
        </div>
        <div class="field">
          <button id="fl-apply" class="primary" data-i18n="dashboard.filters.apply">Filtrer</button>
        </div>
        <div class="field">
          <button id="fl-30d" data-i18n="dashboard.filters.last30d">30 derniers jours</button>
        </div>
        <div class="field">
          <button id="fl-reset" data-i18n="dashboard.filters.reset">Tout l'historique</button>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h2 data-i18n="dashboard.pareto.title">Pareto des erreurs</h2>
        <div id="pareto-chart"></div>
        <p id="pareto-empty" class="muted hidden" data-i18n="dashboard.pareto.empty">Aucune erreur taguée sur cette période.</p>
      </div>

      <div class="panel">
        <h2 data-i18n="dashboard.recent.title">Parties récentes</h2>
        <div id="recent-games"></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <a class="btn primary" style="text-decoration:none;display:inline-block;" href="import.html" data-i18n="dashboard.recent.import">+ Importer une partie</a>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 data-i18n="dashboard.heatmap.title">Heatmap phase × sévérité</h2>
      <div id="heatmap"></div>
      <p id="heatmap-empty" class="muted hidden" data-i18n="dashboard.heatmap.empty">Aucune erreur taguée sur cette période.</p>
    </div>
  </main>

  <script src="js/sgf.js?v=101"></script>
  <script src="js/api.js?v=101"></script>
  <script src="js/i18n.js?v=101"></script>
  <script src="js/nav.js?v=101"></script>
  <script src="js/dashboard.js?v=101"></script>
</body>
</html>
